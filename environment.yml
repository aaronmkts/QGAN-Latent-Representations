name: qlatent
channels:
  - conda-forge
dependencies:
  - python=3.11
  - flax
  - hydra-core
  # CUDA-enabled JAX is installed from pip so WSL/GPU workspaces use GPU by default.
  - joblib
  - matplotlib
  - numpy
  - omegaconf
  - optax
  - pillow
  - pip
  - pytest
  - scikit-image
  - scikit-learn
  - scipy
  - tqdm
  - wandb
  - pip:
      - jax[cuda12]
      - pennylane
      - quimb
      - -e .
