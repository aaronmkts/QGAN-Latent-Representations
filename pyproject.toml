[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qgan-latent-representations"
version = "0.1.0"
description = "Two-workflow JAX/PennyLane testbed for latent-representation generative modelling, including latent-space QGANs and tensor-prior VQ-VAE experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flax",
  "hydra-core",
  "omegaconf",
  "jax[cuda12]",
  "joblib",
  "matplotlib",
  "numpy",
  "optax",
  "pillow",
  "pennylane",
  "quimb",
  "scikit-image",
  "scikit-learn",
  "scipy",
  "tqdm",
  "wandb",
]

[project.scripts]
qgan-latent-pretrain = "qgan_latent.cli.latent_pretrain:main"
qgan-latent-train = "qgan_latent.cli.latent_train:main"
qgan-latent-train-surrogate = "qgan_latent.cli.latent_train_surrogate:main"
qgan-vqvae-pretrain = "qgan_latent.cli.vqvae_pretrain:main"
qgan-vqvae-train-prior = "qgan_latent.cli.vqvae_train_prior:main"
qgan-stage5-test-run = "qgan_latent.cli.stage5_test_run:main"
qgan-cache-latents = "qgan_latent.cli.cache_latents:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qgan_latent*"]
