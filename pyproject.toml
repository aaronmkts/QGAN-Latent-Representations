[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qgan-latent-representations"
version = "0.1.0"
description = "Two-workflow JAX/PennyLane testbed for latent-representation generative modelling, including latent-space QGANs and tensor-prior VQ-VAE experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flax",
  "hydra-core",
  "omegaconf",
  "jax",
  "joblib",
  "matplotlib",
  "numpy",
  "optax",
  "pillow",
  "pennylane",
  "quimb",
  "scikit-image",
  "scikit-learn",
  "scipy",
  "tqdm",
  "wandb",
]

[project.scripts]
qgan-pretrain = "qgan_latent.cli.pretrain:main"
qgan-train = "qgan_latent.cli.train:main"
qgan-train-prior = "qgan_latent.cli.train_prior:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qgan_latent*"]
