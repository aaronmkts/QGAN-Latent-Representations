defaults:
  - model/autoencoder@model.autoencoder
  - data/mnist
  - _self_

seed: 42
batch_size: 128
pretrain_epochs: 100
learning_rate: 1e-3
loss: mse
log_every: 50
sample_every: 500
smoke_test: false
device: gpu
wandb_mode: online

outputs:
  dir: outputs/pretrainautoencoder

checkpoints:
  dir: checkpoints
  autoencoder: autoencoder.ckpt

wandb:
  project: qgan-latent
  entity: null
  tags: []
  name: null

hydra:
  run:
    dir: ${outputs.dir}
