# @package _global_
defaults:
  - /shared/representations@model.autoencoder: spatial_vqvae
  - /shared/data@data: mnist
  - _self_

seed: 42
batch_size: 256
pretrain_epochs: 100
learning_rate: 1e-3
loss: mse
log_every: 50
sample_every: 500
smoke_test: false
device: gpu
wandb_mode: disabled

outputs:
  dir: outputs/tensor_prior_vqvae/pretrain

checkpoints:
  dir: checkpoints
  autoencoder: spatial_vqvae.ckpt

wandb:
  project: qgan-latent
  entity: null
  tags: []
  name: null

hydra:
  run:
    dir: ${outputs.dir}
