# @package _global_
defaults:
  - /shared/representations@model.autoencoder: autoencoder
  - /projects/qgan_expectation_values/models@model.quantum_generator: quantum_generator
  - /projects/qgan_expectation_values/models@model.discriminator: discriminator
  - /shared/data@data: mnist
  - /shared/metrics@metrics: default
  - _self_

seed: 42
batch_size: 128
epochs: 100
n_critic: 5
gen_lr: 1e-3
disc_lr: 1e-3
lambda_gp: 10.0
sample_every: 200
eval_epochs: 10
log_every: 50
smoke_test: false
device: GPU
wandb_mode: disabled

outputs:
  dir: outputs/qgan_expectation_values/train

checkpoints:
  dir: checkpoints
  generator: qgan_gen.ckpt
  discriminator: qgan_disc.ckpt
  autoencoder: autoencoder.ckpt

surrogate:
  enabled: false
  rff_dim: auto
  sigma: 1.0
  hidden_dim: 64

wandb:
  project: qgan-latent
  entity: null
  tags: []
  name: null

hydra:
  run:
    dir: ${outputs.dir}
